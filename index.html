<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RTTEX → PNG Converter</title>
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:#0b0d10;color:#f3f4f6;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    .wrap{width:min(1050px,calc(100% - 28px));margin:0 auto;padding:42px 0}
    h1{margin:0;font-size:30px;letter-spacing:-.5px}
    .sub{margin:8px 0 28px;color:#9ca3af}
    .drop{border:1px dashed #4b5563;border-radius:16px;padding:34px;text-align:center;background:#11151a;transition:.15s}
    .drop.drag{border-color:#fff;background:#171c22}
    input{display:none}
    .choose,.download-all{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer}
    .choose{background:#fff;color:#0b0d10}
    .download-all{background:#252b33;color:#fff}
    .hint{margin-top:12px;color:#8b949e;font-size:13px}
    .status{margin:22px 0 14px;display:flex;justify-content:space-between;gap:12px;align-items:center;color:#aeb6c0;font-size:14px}
    .actions{display:flex;gap:10px;flex-wrap:wrap}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
    .card{background:#11151a;border:1px solid #252b33;border-radius:14px;overflow:hidden}
    .preview{height:170px;display:flex;align-items:center;justify-content:center;padding:12px;background:#0e1115}
    .preview img{max-width:100%;max-height:100%;image-rendering:auto}
    .meta{padding:12px}
    .name{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:10px}
    .card button{width:100%;border:0;border-radius:8px;padding:9px;background:#252b33;color:#fff;cursor:pointer;font-weight:600}
    .error{color:#ff8f8f;font-size:12px;line-height:1.4}
    .empty{border:1px solid #252b33;border-radius:14px;padding:28px;text-align:center;color:#707984}
    @media(max-width:600px){.wrap{padding:25px 0}.drop{padding:26px 18px}h1{font-size:25px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.preview{height:145px}}
  </style>
</head>
<body>
  <main class="wrap">
    <h1>RTTEX → PNG</h1>
    <p class="sub">Batch converter — pilih banyak file sekaligus. Semua proses dilakukan di browser.</p>

    <section class="drop" id="drop">
      <input id="files" type="file" accept=".rttex" multiple>
      <button class="choose" id="choose">📁 Pilih File RTTEX</button>
      <div class="hint">atau drag & drop file .rttex di sini</div>
    </section>

    <div class="status">
      <span id="status">Belum ada file.</span>
      <div class="actions">
        <button class="download-all" id="downloadAll" hidden>⬇ Download Semua</button>
      </div>
    </div>

    <section class="grid" id="results">
      <div class="empty" id="empty">Hasil PNG akan muncul di sini.</div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script>
    const input = document.getElementById('files');
    const choose = document.getElementById('choose');
    const drop = document.getElementById('drop');
    const results = document.getElementById('results');
    const status = document.getElementById('status');
    const downloadAll = document.getElementById('downloadAll');
    const empty = document.getElementById('empty');
    const converted = [];

    choose.onclick = () => input.click();
    input.onchange = () => handleFiles([...input.files]);

    ['dragenter','dragover'].forEach(e => drop.addEventListener(e, ev => {
      ev.preventDefault(); drop.classList.add('drag');
    }));
    ['dragleave','drop'].forEach(e => drop.addEventListener(e, ev => {
      ev.preventDefault(); drop.classList.remove('drag');
    }));
    drop.addEventListener('drop', ev => {
      const files = [...ev.dataTransfer.files].filter(f => /\.rttex$/i.test(f.name));
      handleFiles(files);
    });

    function readNum(b,p,n){
      let v=0;
      for(let i=0;i<n;i++) v += b[p+i] << (i*8);
      return v >>> 0;
    }
    function readString(b,p,n){
      let s='';
      for(let i=0;i<n;i++) s += String.fromCharCode(b[p+i]);
      return s;
    }

    // Based on the RTTEX unpacking logic used by GuckTubeYT's GrowTools.
    function decodeRTTEX(buffer){
      let b = new Uint8Array(buffer);
      if(readString(b,0,6)==='RTPACK') b = pako.inflate(b.slice(32));

      if(readString(b,0,6)!=='RTTXTR')
        throw new Error('Format RTTEX tidak valid');

      const height = readNum(b,8,4);
      const width = readNum(b,12,2);
      const alpha = b[0x1c];
      const channels = 3 + alpha;
      const pixelBytes = width * height * channels;
      const start = 0x7c;

      if(width <= 0 || height <= 0 || start + pixelBytes > b.length)
        throw new Error('Ukuran/data gambar tidak valid');

      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      const image = ctx.createImageData(width,height);
      image.data.set(b.slice(start,start+pixelBytes));
      ctx.putImageData(image,0,0);

      // GrowTools flips the decoded texture vertically when drawing the result.
      const out = document.createElement('canvas');
      out.width = width; out.height = height;
      const octx = out.getContext('2d');
      octx.translate(0,height);
      octx.scale(1,-1);
      octx.drawImage(canvas,0,0);

      return new Promise(resolve => out.toBlob(resolve,'image/png'));
    }

    async function handleFiles(files){
      if(!files.length) return;
      converted.length = 0;
      results.innerHTML = '';
      status.textContent = `Memproses 0/${files.length}...`;
      downloadAll.hidden = true;

      for(let i=0;i<files.length;i++){
        const file = files[i];
        const card = document.createElement('article');
        card.className = 'card';
        card.innerHTML = `<div class="preview">Memproses...</div><div class="meta"><div class="name" title="${escapeHtml(file.name)}">${escapeHtml(file.name)}</div></div>`;
        results.appendChild(card);

        try{
          const blob = await decodeRTTEX(await file.arrayBuffer());
          const url = URL.createObjectURL(blob);
          const pngName = file.name.replace(/\.rttex$/i,'.png');
          card.querySelector('.preview').innerHTML = `<img src="${url}" alt="">`;
          const btn = document.createElement('button');
          btn.textContent = '⬇ Download PNG';
          btn.onclick = () => saveBlob(blob,pngName);
          card.querySelector('.meta').appendChild(btn);
          converted.push({name:pngName,blob});
        }catch(err){
          card.querySelector('.preview').innerHTML = `<div class="error">Gagal: ${escapeHtml(err.message || 'file tidak dapat diproses')}</div>`;
        }
        status.textContent = `Memproses ${i+1}/${files.length}...`;
        await new Promise(r=>setTimeout(r,0));
      }

      status.textContent = `${converted.length} dari ${files.length} file berhasil dikonversi.`;
      downloadAll.hidden = converted.length === 0;
    }

    function saveBlob(blob,name){
      const a=document.createElement('a');
      a.href=URL.createObjectURL(blob);
      a.download=name;
      a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href),1000);
    }

    downloadAll.onclick = async () => {
      if(!converted.length) return;
      downloadAll.disabled = true;
      downloadAll.textContent = 'Membuat ZIP...';
      const zip = new JSZip();
      converted.forEach(x => zip.file(x.name,x.blob));
      const blob = await zip.generateAsync({type:'blob'});
      saveBlob(blob,'rttex-png.zip');
      downloadAll.disabled = false;
      downloadAll.textContent = '⬇ Download Semua';
    };

    function escapeHtml(s){
      return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
    }
  </script>
</body>
</html>
